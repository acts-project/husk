# OpenShift-only binary build. Applied by k8s-live-build, not the app overlay.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: huskd
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: huskd
spec:
  runPolicy: Serial
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  completionDeadlineSeconds: 1200
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: huskd:latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  triggers: []
