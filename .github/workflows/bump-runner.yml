name: bump-runner

# Weekly check for a new actions/runner release. If upstream is ahead of
# RUNNER_VERSION in images/versions.env, open (or update) a PR bumping it.
#
# Why this exists: the runner binary is BAKED into the golden images
# (images/build.sh), so nothing bumps it by itself and nothing complains when it
# rots — a stale pin just means every slot pays a self-update on first job, and
# eventually GitHub stops accepting the version at all.
#
# The PR is authored with BUMP_PR_TOKEN, a fine-grained PAT — NOT the default
# GITHUB_TOKEN. GitHub suppresses `push`/`pull_request` events caused by
# GITHUB_TOKEN (loop prevention), which here would mean ci.yml never runs, its
# required `test (3.x)` contexts never report, and the PR is permanently
# unmergeable. It would also skip build-images.yml — the one job that actually
# proves the new runner tarball installs cleanly.
#
# Required setup: a fine-grained PAT on acts-project/husk with Contents: write
# and Pull requests: write, stored as the BUMP_PR_TOKEN repo secret.

on:
  schedule:
    # Mon 06:17 UTC, a day before build-images.yml's Tuesday rebuild, so a merged
    # bump is baked the same week. Odd minute: on-the-hour crons queue behind the
    # scheduler backlog. GitHub also auto-disables cron on repos idle 60 days.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-runner
  cancel-in-progress: false # never cancel a half-pushed branch

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check for a newer runner release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source images/versions.env

          latest="$(gh api repos/actions/runner/releases/latest -q .tag_name)"
          latest="${latest#v}"
          # Validate before this ever reaches sed or a URL: it is remote input.
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $latest" >&2; exit 1; }

          if [ "$latest" = "$RUNNER_VERSION" ]; then
            echo "up to date ($RUNNER_VERSION)"
            echo "bump=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Only ever go forward — guards against a yanked release or a
          # transiently stale /releases/latest handing us an older tag.
          newest="$(printf '%s\n%s\n' "$RUNNER_VERSION" "$latest" | sort -V | tail -1)"
          if [ "$newest" != "$latest" ]; then
            echo "pinned $RUNNER_VERSION is ahead of upstream $latest — nothing to do"
            echo "bump=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The release is published before its assets finish uploading. Opening a
          # PR in that window means a red build for a reason that isn't our code.
          url="https://github.com/actions/runner/releases/download/v${latest}/actions-runner-linux-x64-${latest}.tar.gz"
          if ! curl -fsIL -o /dev/null "$url"; then
            echo "linux-x64 asset not published yet — will retry next week"
            echo "bump=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          sed -i -E "s|^RUNNER_VERSION=.*|RUNNER_VERSION=${latest}|" images/versions.env
          { echo "bump=true"; echo "from=$RUNNER_VERSION"; echo "to=$latest"; } >> "$GITHUB_OUTPUT"

      - name: Open or update the bump PR
        if: steps.check.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_PR_TOKEN }}
          FROM: ${{ steps.check.outputs.from }}
          TO: ${{ steps.check.outputs.to }}
          # Kept in env rather than inlined: values that reach a shell via ${{ }}
          # are a template-injection vector (zizmor).
          BRANCH: bot/bump-runner
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::BUMP_PR_TOKEN is not set — see the header of this workflow"
            exit 1
          fi

          git config user.name "husk-bot"
          git config user.email "husk-bot@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "Bump actions/runner ${FROM} -> ${TO}"

          # One fixed branch, force-updated. A version-suffixed branch would leave
          # a stale PR behind every time a newer release lands mid-review; this
          # way there is always exactly zero or one open bump PR, at the newest
          # version. The token is masked in logs, but keep it off the remote
          # config too — it is only ever a push-time argument.
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

          body="$(cat <<EOF
          Automated bump of \`RUNNER_VERSION\` in \`images/versions.env\`: \`${FROM}\` -> \`${TO}\`.

          Release notes: https://github.com/actions/runner/releases/tag/v${TO}

          The runner is baked into the golden images, so **merging this does not
          ship anything**. To roll it out:

          1. Merge.
          2. Wait for the weekly \`build-images\` rebuild (Tue 04:43 UTC), or run it
             manually to publish a tag now.
          3. Repoint \`image_ref\` in the pool configs at the new tag.
          EOF
          )"

          existing="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Bump actions/runner to ${TO}" --body "$body"
            echo "updated PR #${existing}"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Bump actions/runner to ${TO}" --body "$body"
          fi
